name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (without v)'
        required: true
        type: string

permissions:
  contents: read
  # OIDC Trusted Publishing：npm 通过 GitHub OIDC 身份认证，无需长期 token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 注意：不能设置 registry-url，否则会写入 _authToken 遮蔽 OIDC 认证
          node-version: 22
          cache: pnpm

      - name: Upgrade npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: pnpm --filter weui-uniapp-design check:release-version

      - name: Unit and type checks
        run: pnpm test && pnpm typecheck

      - name: Build and verify package tarball
        run: pnpm --filter weui-uniapp-design prepack

      - name: Build consumers and docs
        run: |
          pnpm --filter weui-uniapp-design-vue3-example build
          pnpm --filter weui-uniapp-design-example build:h5
          pnpm --filter weui-uniapp-design-example build:mp-weixin
          pnpm build:docs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Publish to npm
        # 上述 prepack 已验证当前目录；publish 禁止重复执行生命周期脚本。
        run: cd packages/components && npm publish --ignore-scripts --provenance --access public
