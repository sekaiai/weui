name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # OIDC Trusted Publishing：npm 通过 GitHub OIDC 身份认证，无需长期 token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 pnpm-lock.yaml 的 lockfileVersion 9.0（pnpm 9/10）保持一致
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # OIDC 需要 npm >= 11.5.1，对应 Node 22.14+
          # 注意：不能设置 registry-url，否则会写入 _authToken 遮蔽 OIDC 认证
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # prepack 脚本会自动执行 pnpm build
        # 无 NODE_AUTH_TOKEN 时 pnpm publish 自动走 OIDC Trusted Publishing
        run: pnpm --filter weui-uniapp-design publish --no-git-checks
